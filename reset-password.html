<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<script>
  // กันหน้าวาบสีผิดธีมตอนโหลด (อ่านค่าธีมที่เคยเลือกไว้ก่อน CSS จะ paint)
  (function () {
    try {
      var t = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ตั้งรหัสผ่านใหม่ — กินอะไรดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand"><span class="brand-mark">🍲</span> กินอะไรดี</a>
      <div class="navbar-right">
        <button type="button" class="theme-toggle" data-theme-toggle></button>
      </div>
    </div>
  </nav>

  <main class="auth-shell">
    <div class="auth-card panel">
      <h2 style="margin-bottom:4px">ตั้งรหัสผ่านใหม่</h2>
      <p id="intro-text" style="margin-bottom:20px">กรอกรหัสผ่านใหม่ที่ต้องการใช้เข้าสู่ระบบ</p>

      <div id="form-error" class="form-error"></div>

      <form id="reset-form">
        <div class="field">
          <label for="password">รหัสผ่านใหม่</label>
          <input type="password" id="password" class="input" required minlength="6" autocomplete="new-password"
                 pattern="[\x00-\x7F]*"
                 title="กรุณากรอกเป็นภาษาอังกฤษเท่านั้น" />
          <small>อย่างน้อย 6 ตัวอักษร (ภาษาอังกฤษ/ตัวเลข/สัญลักษณ์)</small>
        </div>
        <div class="field">
          <label for="password-confirm">ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="password-confirm" class="input" required minlength="6" autocomplete="new-password"
                 pattern="[\x00-\x7F]*"
                 title="กรุณากรอกเป็นภาษาอังกฤษเท่านั้น" />
          <small class="field-error">รหัสผ่านทั้งสองช่องไม่ตรงกัน</small>
        </div>
        <button type="submit" class="btn btn-primary btn-block">ตั้งรหัสผ่านใหม่</button>
      </form>

      <div id="invalid-link" class="empty-state" style="display:none">
        <div class="glyph">⚠️</div>
        <p>ลิงก์รีเซ็ตรหัสผ่านนี้หมดอายุหรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่อีกครั้ง</p>
        <a href="forgot-password.html" class="btn btn-outline">ขอลิงก์รีเซ็ตรหัสผ่านใหม่</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async function () {
      initThemeToggle(document.querySelector("[data-theme-toggle]"));

      const form = document.getElementById("reset-form");
      const errorEl = document.getElementById("form-error");
      const invalidLinkEl = document.getElementById("invalid-link");
      const introText = document.getElementById("intro-text");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("password-confirm");
      const confirmErrorEl = confirmInput.closest(".field").querySelector(".field-error");
      restrictToAscii(passwordInput);
      restrictToAscii(confirmInput);

      function checkMatch() {
        const ok = !confirmInput.value || confirmInput.value === passwordInput.value;
        confirmInput.setCustomValidity(ok ? "" : "รหัสผ่านทั้งสองช่องไม่ตรงกัน");
        confirmErrorEl.classList.toggle("is-visible", !ok);
        return ok;
      }
      passwordInput.addEventListener("input", checkMatch);
      confirmInput.addEventListener("input", checkMatch);
      confirmInput.addEventListener("blur", checkMatch);

      // ลิงก์รีเซ็ตรหัสผ่านจาก Supabase จะสร้าง session ชั่วคราวให้อัตโนมัติตอนโหลดหน้านี้
      // (ผ่านพารามิเตอร์ใน URL) — ถ้าไม่มี session แปลว่าลิงก์หมดอายุ/ไม่ถูกต้อง/เปิดหน้านี้ตรง ๆ
      let session = null;
      try {
        session = await DB.getSession();
      } catch (err) {
        console.error("[reset-password] ตรวจสอบ session ไม่สำเร็จ:", err);
      }
      if (!session) {
        form.style.display = "none";
        introText.style.display = "none";
        invalidLinkEl.style.display = "block";
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      bindAuthForm({
        form,
        submitBtn,
        errorEl,
        submittingText: "กำลังตั้งรหัสผ่านใหม่...",
        onSubmit: async () => {
          if (!checkMatch()) throw new Error("รหัสผ่านทั้งสองช่องไม่ตรงกัน");
          await DB.updatePassword(passwordInput.value);
          await DB.signOut();
          Toast.show("ตั้งรหัสผ่านใหม่สำเร็จ กรุณาเข้าสู่ระบบอีกครั้ง", "success");
          window.location.href = "login.html";
        },
      });
    })();
  </script>
</body>
</html>
